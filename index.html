<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGo - Admin Panel</title>
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>
<style>
  :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #10b981; --danger: #ef4444; --blue: #1D9BF0; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
  h1 { margin: 0; font-size: 20px; color: var(--accent); }
  
  /* Tabs */
  .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
  .tab { padding: 10px 20px; background: var(--panel); border-radius: 8px; cursor: pointer; font-weight: bold; }
  .tab.active { background: var(--accent); color: white; }
  
  /* Cards */
  .card { background: var(--panel); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-left: 4px solid transparent; }
  .card.banned { border-left-color: var(--danger); opacity: 0.7; }
  .card.verified { border-left-color: var(--blue); }
  .card-info { flex: 1; }
  .card-info strong { display: block; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .card-info span { font-size: 12px; color: #94a3b8; display: block; }
  
  .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; color: white; }
  .btn-ban { background: var(--danger); }
  .btn-unban { background: var(--accent); }
  .btn-verify { background: var(--blue); }
  .btn-gray { background: #475569; }
  .btn-logout { background: #334155; padding: 10px 15px; font-size: 14px;}
  
  #login-section { display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin: 50px auto; }
  input { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
  
  .tick-svg { width: 16px; height: 16px; display: inline-block; vertical-align: middle; fill: var(--blue); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ChatGo Admin</h1>
    <button class="btn btn-logout hidden" id="btn-logout">Logout</button>
  </div>

  <div id="login-section">
    <h3>Login Admin</h3>
    <input type="text" id="admin-user" placeholder="Username">
    <input type="password" id="admin-pass" placeholder="Password">
    <button class="btn btn-unban" id="btn-login" style="padding: 12px;">Masuk</button>
  </div>

  <div id="dashboard" class="hidden">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('users')">Pengguna</div>
      <div class="tab" onclick="switchTab('status')">Status</div>
      <div class="tab" onclick="switchTab('chats')">Chat</div>
    </div>
    
    <div id="tab-content">
      <!-- Content will be loaded here -->
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyAt3cwXZtgkeiD0B3yJy1DOXKtlte1oiIM",
  authDomain: "chatgo-f4a66.firebaseapp.com",
  projectId: "chatgo-f4a66",
  storageBucket: "chatgo-f4a66.firebasestorage.app",
  messagingSenderId: "539633388986",
  appId: "1:539633388986:web:7517fa6642057a05a92183"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (s) => document.querySelector(s);
const emailFor = (u) => `${u.toLowerCase().trim()}@chatgo.local`;
let currentTab = 'users';

// SVG Blue Tick
const BLUE_TICK = `<svg class="tick-svg" viewBox="0 0 24 24"><path d="M12 2L14.5 5.5L18.5 4.5L19.5 8.5L23 11L20.5 14.5L21.5 18.5L17.5 19.5L15 23L11.5 20.5L7.5 21.5L6.5 17.5L3 15L5.5 11.5L4.5 7.5L8.5 6.5L11 3L12 2Z"/><path d="M8 12L11 15L16 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;

$('#btn-login').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, emailFor($('#admin-user').value), $('#admin-pass').value); }
  catch (err) { alert("Login gagal: " + err.message); }
};

$('#btn-logout').onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists() && snap.data().role === 'admin') {
      $('#login-section').classList.add('hidden');
      $('#dashboard').classList.remove('hidden');
      $('#btn-logout').classList.remove('hidden');
      loadTab(currentTab);
    } else {
      alert("Akses Ditolak! Anda bukan Admin.");
      signOut(auth);
    }
  } else {
    $('#login-section').classList.remove('hidden');
    $('#dashboard').classList.add('hidden');
    $('#btn-logout').classList.add('hidden');
  }
});

window.switchTab = (tab) => {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  loadTab(tab);
};

async function loadTab(tab) {
  const content = $('#tab-content');
  content.innerHTML = '<p>Memuat data...</p>';
  
  if (tab === 'users') {
    const snap = await getDocs(collection(db, 'users'));
    content.innerHTML = snap.docs.map(d => {
      const u = d.data();
      return `<div class="card ${u.isBanned ? 'banned' : ''} ${u.isVerified ? 'verified' : ''}">
        <div class="card-info">
          <strong>${u.displayName} ${u.isVerified ? BLUE_TICK : ''} <span style="color:#94a3b8; font-size:12px">@${u.username}</span></strong>
          <span>Role: ${u.role || 'user'}</span>
        </div>
        <div style="display:flex; gap:5px;">
          <button class="btn ${u.isVerified ? 'btn-gray' : 'btn-verify'}" onclick="toggleVerify('${d.id}', ${!!u.isVerified})">
            ${u.isVerified ? 'Hapus Centang' : 'Beri Centang'}
          </button>
          <button class="btn ${u.isBanned ? 'btn-unban' : 'btn-ban'}" onclick="toggleBanUser('${d.id}', ${!!u.isBanned})">
            ${u.isBanned ? 'Buka Ban' : 'Ban User'}
          </button>
        </div>
      </div>`;
    }).join('');
  } 
  
  else if (tab === 'status') {
    const snap = await getDocs(collection(db, 'status'));
    if(snap.empty) return content.innerHTML = '<p>Tidak ada status.</p>';
    content.innerHTML = snap.docs.map(d => {
      const s = d.data();
      const isBanned = s.isBanned ? 'banned' : '';
      return `<div class="card ${isBanned}">
        <div class="card-info">
          <strong>${s.userName}</strong>
          <span>Tipe: ${s.type} | Teks: ${s.content || '-'}</span>
        </div>
        <button class="btn btn-ban" onclick="deleteData('status', '${d.id}')">Hapus Status</button>
      </div>`;
    }).join('');
  }
  
  else if (tab === 'chats') {
    const snap = await getDocs(collection(db, 'chats'));
    if(snap.empty) return content.innerHTML = '<p>Tidak ada chat.</p>';
    content.innerHTML = snap.docs.map(d => {
      const c = d.data();
      const isBanned = c.isBanned ? 'banned' : '';
      return `<div class="card ${isBanned}">
        <div class="card-info">
          <strong>${c.name || 'Chat Pribadi'} ${c.isVerified ? BLUE_TICK : ''}</strong>
          <span>Tipe: ${c.type} | Anggota: ${c.members?.length || 0} orang</span>
        </div>
        <div style="display:flex; gap:5px;">
          ${c.type === 'group' ? `
          <button class="btn ${c.isVerified ? 'btn-gray' : 'btn-verify'}" onclick="toggleVerifyChat('${d.id}', ${!!c.isVerified})">
            ${c.isVerified ? 'Hapus Centang' : 'Beri Centang'}
          </button>` : ''}
          <button class="btn btn-ban" onclick="deleteData('chats', '${d.id}')">Hapus Chat</button>
        </div>
      </div>`;
    }).join('');
  }
}

// --- ACTIONS ---
window.toggleVerify = async (uid, current) => {
  await updateDoc(doc(db, 'users', uid), { isVerified: !current });
  loadTab('users');
};

window.toggleVerifyChat = async (chatId, current) => {
  await updateDoc(doc(db, 'chats', chatId), { isVerified: !current });
  loadTab('chats');
};

window.toggleBanUser = async (uid, current) => {
  await updateDoc(doc(db, 'users', uid), { isBanned: !current });
  loadTab('users');
};

window.deleteData = async (col, id) => {
  if (!confirm(`Hapus data ini dari ${col}?`)) return;
  await deleteDoc(doc(db, col, id));
  loadTab(currentTab);
};
</script>
</body>
</html>
